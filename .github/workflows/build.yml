# Tests cain on Linux (several shells, awks and distros), macOS and Windows.
# Nothing is compiled: cain is a POSIX sh + awk script (cain.ps1 on Windows).
name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shells and awks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox ksh yash zsh gawk original-awk shellcheck > /dev/null
          shellcheck -s sh -S warning cain vps.sh tests/run.sh
          mkdir -p /tmp/awk/gawk /tmp/awk/bsd /tmp/awk/busybox
          ln -s "$(command -v gawk)" /tmp/awk/gawk/awk
          ln -s "$(command -v original-awk)" /tmp/awk/bsd/awk
          printf '#!/bin/sh\nexec busybox awk "$@"\n' > /tmp/awk/busybox/awk && chmod +x /tmp/awk/busybox/awk
          for sh in dash "bash --posix" "busybox sh" ksh yash "zsh --emulate sh"; do
            for awk in default gawk bsd busybox; do
              echo "::group::$sh / $awk awk"
              PATH=/tmp/awk/$awk:$PATH CAIN_SH="$sh" sh tests/run.sh || exit 1
              echo "::endgroup::"
            done
          done
      - name: The PowerShell version writes the same AutoHotkey script
        shell: bash
        run: |
          HOME=/home/cain-test CAIN_DIR=. pwsh -NoProfile -File cain.ps1 generate | tr -d '\r' > /tmp/ahk.txt
          diff -u tests/expected/windows.txt /tmp/ahk.txt

  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [alpine, debian, ubuntu, fedora, archlinux, "rockylinux/rockylinux:9", "opensuse/tumbleweed"]
    steps:
      - uses: actions/checkout@v4
      - name: Tests on a fresh ${{ matrix.image }}, with nothing installed first
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" sh -c 'cp -r /src /tmp/cain && cd /tmp/cain && sh tests/run.sh'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/run.sh
      - run: CAIN_SH=zsh sh tests/run.sh
      - run: CAIN_SH=/bin/bash sh tests/run.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Same AutoHotkey script as the shell version (Windows PowerShell 5.1 and PowerShell 7)
        shell: pwsh
        run: |
          $env:HOME = '/home/cain-test'; $env:CAIN_DIR = '.'
          $want = [IO.File]::ReadAllText("$PWD/tests/expected/windows.txt").Replace("`r`n", "`n")
          foreach ($run in 'cain.cmd generate > ahk.txt', 'pwsh -NoProfile -File cain.ps1 generate > ahk.txt') {
            cmd /c $run
            if ($LASTEXITCODE) { throw "$run failed" }
            $got = [IO.File]::ReadAllText("$PWD/ahk.txt").Replace("`r`n", "`n")
            if ($got -ne $want) { git diff --no-index tests/expected/windows.txt ahk.txt; throw "${run}: different" }
            "ok    $run"
          }
      - name: Dry run and a real install into a throwaway home folder
        shell: pwsh
        run: |
          $env:HOME = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          ./cain.cmd install -n -y
          if ($LASTEXITCODE) { exit 1 }
          ./cain.cmd install dotfiles
          if ($LASTEXITCODE) { exit 1 }
          foreach ($f in '.config\micro\settings.json', '.config\cain\cain.ps1', '.local\bin\cain.cmd', '.config\cain\repo') {
            if (-not (Test-Path (Join-Path $env:HOME $f))) { throw "missing $f" }
          }
          ./cain.cmd install dotfiles | Select-String 'SAME:' | Measure-Object | ForEach-Object { if ($_.Count -lt 3) { throw 'second install should say SAME' } }
          $out = ./cain.cmd install nope 2>&1 | Out-String
          if ($out -notmatch 'unknown install step') { throw "bad step not caught: $out" }
          $global:LASTEXITCODE = 0   # that last run was meant to fail
