# Matches the GNOME Terminal profile "rhett"

# --- Font (GNOME uses the system monospace font: DejaVu Sans Mono 10) ---
font_family      DejaVu Sans Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# --- Colors ---
foreground #D3D7CF
background #151414
background_opacity 1.0

# Cursor: GNOME draws it in the foreground color with the text inverted
cursor            #D3D7CF
cursor_text_color background
cursor_shape      block
cursor_blink_interval 0

# Selection: inverted, like GNOME's default
selection_foreground #151414
selection_background #D3D7CF

# Tango palette (GNOME Terminal's built-in scheme)
color0  #2E3436
color8  #555753
color1  #CC0000
color9  #EF2929
color2  #4E9A06
color10 #8AE234
color3  #C4A000
color11 #FCE94F
color4  #3465A4
color12 #729FCF
color5  #75507B
color13 #AD7FA8
color6  #06989A
color14 #34E2E2
color7  #D3D7CF
color15 #EEEEEC

# --- Window ---
remember_window_size  no
initial_window_width  80c
initial_window_height 24c
window_padding_width  1

# --- Behaviour ---
scrollback_lines -1
enable_audio_bell no

# --- Panes ---
# "splits" lets you split panes yourself; "stack" (Ctrl+Shift+L) zooms one pane
enabled_layouts splits,stack
# Ctrl+Shift+Enter: split vertically (new pane to the right, same directory)
map ctrl+shift+enter launch --location=vsplit --cwd=current
# Pane divider: dim gray instead of the default bright green
active_border_color   #3a3a3a
inactive_border_color #3a3a3a

# --- GUI-style copy/paste ---
# Ctrl+C copies if there's a selection, otherwise sends a normal Ctrl+C (interrupt)
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
# Ctrl+Shift+C always interrupts (sends ^C)
map ctrl+shift+c send_text all \x03
# Ctrl+Shift+V keeps pasting too
map ctrl+shift+v paste_from_clipboard
